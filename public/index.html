<script>
const videoTable = document.getElementById('videoTable');

// Cargar lista de videos desde backend
async function renderVideos() {
    try {
        const res = await fetch('/videos');
        if (!res.ok) throw new Error('Error al obtener videos');
        const videos = await res.json();
        videoTable.innerHTML = '';
        videos.forEach(v => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${v.title}</td>
                <td class="${v.active ? 'status-active':'status-inactive'}">
                    ${v.active ? 'Activo':'Inactivo'}
                </td>
                <td>
                    <button class="btn" onclick="toggleStatus(${v.id})">
                        ${v.active ? 'Desactivar':'Activar'}
                    </button>
                    <button class="btn" onclick="deleteVideo(${v.id})">Eliminar</button>
                </td>
            `;
            videoTable.appendChild(row);
        });
    } catch(err) {
        console.error(err);
        alert('Error al cargar videos');
    }
}

// Activar / desactivar
async function toggleStatus(id) {
    try {
        const res = await fetch(`/videos/${id}/toggle`, { method: 'POST' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Error al actualizar estado');
        renderVideos();
    } catch(err) {
        console.error(err);
        alert(err.message);
    }
}

// Eliminar video
async function deleteVideo(id) {
    try {
        const res = await fetch(`/videos/${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Error al eliminar video');
        renderVideos();
    } catch(err) {
        console.error(err);
        alert(err.message);
    }
}

// Subir video
async function uploadVideo() {
    const fileInput = document.getElementById('videoFile');
    if(fileInput.files.length === 0) return alert('Selecciona un video');
    const file = fileInput.files[0];
    const formData = new FormData();
    formData.append('video', file);

    try {
        const res = await fetch('/upload', { method:'POST', body: formData });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Error al subir video');
        alert(data.message);
        renderVideos();
    } catch(err) {
        console.error(err);
        alert(err.message);
    }
}

// Actualizar playlist
async function updatePlaylist() {
    try {
        const res = await fetch('/playlist/update', { method:'POST' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'Error al actualizar playlist');
        alert(data.message);
    } catch(err) {
        console.error(err);
        alert(err.message);
    }
}

// Inicializar tabla al cargar
renderVideos();
</script>
